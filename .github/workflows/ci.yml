name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-export:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('project.godot') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read Godot version
        id: gv
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.gv.outputs.version }}
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --import
      - name: Run GUT tests
        run: godot --headless -s addons/gut/gut_cmdln.gd -gexit
      - name: Export Web (smoke test)
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
