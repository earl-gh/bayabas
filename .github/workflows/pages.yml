name: Pages
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('project.godot') != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        id: gv
        run: |
          echo "godot=$(cat .godot-version)" >> "$GITHUB_OUTPUT"
          echo "app=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        if: github.event.action != 'closed'
        with:
          version: ${{ steps.gv.outputs.godot }}
          use-dotnet: false
          include-templates: true
      - name: Stamp version and export Web
        if: github.event.action != 'closed'
        run: |
          SUFFIX=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then SUFFIX="-pr${{ github.event.number }}+${GITHUB_SHA::7}"; fi
          sed -i "s|^config/version=.*|config/version=\"${{ steps.gv.outputs.app }}${SUFFIX}\"|" project.godot
          godot --headless --import
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
      - name: Deploy main to Pages root
        if: github.event_name == 'push'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean-exclude: pr-preview
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: build/web
          preview-branch: gh-pages
          umbrella-dir: pr-preview
