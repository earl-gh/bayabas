name: Pages
# One live site: every push to main rebuilds and replaces
#   https://earl-gh.github.io/bayabas/
# Needs Settings -> Pages -> Source: "GitHub Actions". PRs are verified by ci.yml
# (tests + web/Android exports); they are not deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read versions
        id: gv
        run: |
          echo "godot=$(cat .godot-version)" >> "$GITHUB_OUTPUT"
          echo "app=$(cat version.txt)" >> "$GITHUB_OUTPUT"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.gv.outputs.godot }}
          use-dotnet: false
          include-templates: true
      - name: Stamp version and export Web
        run: |
          sed -i "s|^config/version=.*|config/version=\"${{ steps.gv.outputs.app }}+${GITHUB_SHA::7}\"|" project.godot
          godot --headless --import
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
